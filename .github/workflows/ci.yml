name: CI

on:
  push:
  pull_request:

jobs:
  assembler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assembler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - run: make test
      - run: make typecheck

  emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      # Zig 0.15 is the only supported version (see README.md).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: make test
      - run: make typecheck
      # The example programs of the introduction slides.
      - run: make -C ../doc/intro test

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: make test
      - run: make typecheck

  translator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: translator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: make test
      - run: make typecheck

  doc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - run: make test
      - run: make typecheck

  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: make test
      - run: make typecheck

  hdl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hdl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: make test
      # The runtime's and the translator's programs, on both cores.
      - run: make programs
      - run: make programs CORE=multicycle
      # The style of CODING_STYLE.md, as far as vsg can check it.
      - run: pip install vsg==3.35.0
      - run: make lint
      - run: pip install mypy
      - run: make typecheck

  formal:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hdl
    steps:
      - uses: actions/checkout@v4
      # The versions of hdl/README.md, The formal checks. The GHDL plugin
      # loads the libraries of ghdl-gcc.
      - run: |
          sudo apt-get update
          sudo apt-get install -y yosys yosys-plugin-ghdl ghdl-gcc
      # Boolector 3.2.3, built from source: Ubuntu 24.04 packages 1.5, which
      # smtbmc cannot drive.
      - uses: actions/cache@v4
        id: boolector
        with:
          path: /opt/boolector
          key: boolector-3.2.3-ubuntu-24.04
      - if: steps.boolector.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          git clone --depth 1 --branch 3.2.3 https://github.com/Boolector/boolector.git
          cd boolector
          ./contrib/setup-cadical.sh
          ./contrib/setup-btor2tools.sh
          ./configure.sh --prefix /opt/boolector
          make -C build -j4 install
      - run: echo /opt/boolector/bin >> "$GITHUB_PATH"
      - run: |
          git clone --depth 1 --branch yosys-0.33 https://github.com/YosysHQ/sby.git /tmp/sby
          sudo make -C /tmp/sby install PREFIX=/usr/local
      - run: |
          curl -sSL https://github.com/SRI-CSL/yices2/releases/download/Yices-2.6.4/yices-2.6.4-x86_64-pc-linux-gnu.tar.gz | tar xz -C /tmp
          sudo cp /tmp/yices-2.6.4/bin/* /usr/local/bin/
      - run: make formal

  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - run: make test
      - run: make typecheck

  intro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc/intro
    steps:
      - uses: actions/checkout@v4
      # pdflatex with beamer, and pdftotext.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base \
            texlive-latex-recommended texlive-fonts-recommended texlive-pictures \
            texlive-latex-extra lmodern poppler-utils
      # The checked-in nice_intro.pdf must match nice_intro.tex.
      - run: make pdfcheck
