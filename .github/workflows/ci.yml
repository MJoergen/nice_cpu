name: CI

on:
  push:
  pull_request:

jobs:
  assembler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assembler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - run: make test
      - run: make typecheck

  emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      # Zig 0.17 is the only supported version (see README.md).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: make test
      - run: make typecheck
      # The example programs of the introduction slides.
      - run: make -C ../doc/intro test

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: make test
      - run: make typecheck

  translator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: translator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # test/build.py builds the C library, which needs llvm-ar.
      - run: sudo apt-get update && sudo apt-get install -y llvm lld
      - run: make test
      - run: make typecheck

  doc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - run: make test
      - run: make typecheck

  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: make test
      - run: make typecheck

  hdl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hdl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: make test
      # The style of CODING_STYLE.md, as far as vsg can check it.
      - run: pip install vsg==3.35.0
      - run: make lint
      - run: pip install mypy
      - run: make typecheck

  # The runtime's and the translator's programs on each core. They take
  # hours in GHDL, so they run apart from the hdl job, in three shards of each
  # core (hdl/Makefile, SHARD), to stay far under the 6 hour limit of a job.
  # The shares have equal emulator steps. libc_mchess runs without its
  # "perft 3" here (runtime/libc/Makefile), since that has 11.35 of the
  # 18.1 million steps of all the programs.
  programs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: [pipeline, multicycle]
        shard: ["1/3", "2/3", "3/3"]
    defaults:
      run:
        working-directory: hdl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: make programs CORE=${{ matrix.core }} SHARD=${{ matrix.shard }}

  formal:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hdl
    steps:
      - uses: actions/checkout@v4
      # The tools of hdl/README.md, The formal checks: a pinned OSS CAD
      # Suite, with Yosys, the GHDL plugin, SymbiYosys, Yices, and
      # Boolector. Its programs set up their own environment.
      - run: |
          curl -sSL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-30/oss-cad-suite-linux-x64-20260930.tgz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - run: make formal
      # The counterexamples of a failed proof.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formal-traces
          path: |
            hdl/build/*/engine_*/trace*.vcd
            hdl/build/formal_*.log

  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - run: make test
      - run: make typecheck

  intro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc/intro
    steps:
      - uses: actions/checkout@v4
      # pdflatex with beamer, and pdftotext.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base \
            texlive-latex-recommended texlive-fonts-recommended texlive-pictures \
            texlive-latex-extra lmodern poppler-utils
      # The checked-in nice_intro.pdf must match nice_intro.tex.
      - run: make pdfcheck
