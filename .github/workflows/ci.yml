name: CI

on:
  push:
  pull_request:

jobs:
  assembler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assembler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - run: make test
      - run: make typecheck

  emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      # Zig 0.17 is the only supported version (see README.md).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: make test
      - run: make typecheck
      # The example programs of the introduction slides.
      - run: make -C ../doc/intro test

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: make test
      - run: make typecheck

  translator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: translator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # test/build.py builds the C library, which needs llvm-ar.
      - run: sudo apt-get update && sudo apt-get install -y llvm lld
      - run: make test
      - run: make typecheck

  doc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - run: make test
      - run: make typecheck

  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: make test
      - run: make typecheck

  hdl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hdl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: make test
      # The style of CODING_STYLE.md, as far as vsg can check it.
      - run: pip install vsg==3.35.0
      - run: make lint
      - run: pip install mypy
      - run: make typecheck

  # The runtime's and the translator's programs on each core, apart from
  # the hdl job. They run in nvc (hdl/sim.mk), which is several times
  # faster than GHDL on long runs, while the hdl job runs make test in
  # GHDL, so that the VHDL keeps working in both. nvc comes from the
  # Ubuntu 24.04 package of its release, checked against its digest.
  # libc_mchess runs without its "perft 3" here (runtime/libc/Makefile),
  # since that has 11.35 of the 18.1 million steps of all the programs.
  programs:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        core: [pipeline, multicycle]
    defaults:
      run:
        working-directory: hdl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: |
          curl -sSLo "$RUNNER_TEMP/nvc.deb" https://github.com/nickg/nvc/releases/download/r1.23.0/nvc_1.23.0-1_amd64_ubuntu-24.04.deb
          echo "33d65eafb83d83352716895e44c116002f94d8a198a9486a3cee6df3e4fdfb89  $RUNNER_TEMP/nvc.deb" | sha256sum -c
          sudo apt-get update && sudo apt-get install -y "$RUNNER_TEMP/nvc.deb"
      - run: make programs CORE=${{ matrix.core }} SIM=nvc

  formal:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hdl
    steps:
      - uses: actions/checkout@v4
      # The tools of hdl/README.md, The formal checks: a pinned OSS CAD
      # Suite, with Yosys, the GHDL plugin, SymbiYosys, Yices, and
      # Boolector. Its programs set up their own environment.
      - run: |
          curl -sSL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-30/oss-cad-suite-linux-x64-20260930.tgz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - run: make formal
      # The counterexamples of a failed proof.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formal-traces
          path: |
            hdl/build/*/engine_*/trace*.vcd
            hdl/build/formal_*.log

  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mypy
      - run: make test
      - run: make typecheck

  intro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc/intro
    steps:
      - uses: actions/checkout@v4
      # pdflatex with beamer, and pdftotext.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base \
            texlive-latex-recommended texlive-fonts-recommended texlive-pictures \
            texlive-latex-extra lmodern poppler-utils
      # The checked-in nice_intro.pdf must match nice_intro.tex.
      - run: make pdfcheck
